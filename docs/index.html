<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>TUI Compose</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💻</text></svg>">
    
    <meta name="description" content="TUI Compose — легковесный TUI-фреймворк для Go с графиками, диаграммами, реактивностью и поддержкой Windows.">
    <meta name="keywords" content="tui, go, terminal, ui, framework, lightweight, charts, react">

    <link id="hljs-light" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" media="(prefers-color-scheme: light)">
    <link id="hljs-dark" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        :root {
            --bg-body: #f8f9fa;
            --bg-content: #ffffff;
            --text-color: #212529;
            --border-color: #dee2e6;
            --code-bg: #f5f5fa;
            --table-border: #dee2e6;
            --link-color: #0366d6;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-body: #0d1117;
                --bg-content: #161b22;
                --text-color: #c9d1d9;
                --border-color: #30363d;
                --code-bg: #1d232b;
                --table-border: #30363d;
                --link-color: #58a6ff;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 960px;
            margin: 0 auto;
            padding: 20px;
            background: var(--bg-body);
            color: var(--text-color);
            transition: background 0.2s, color 0.2s;
        }

        #header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 12px 0 8px 0;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 24px;
        }

        #header h1 {
            font-size: 26px;
            margin: 0;
            font-weight: 600;
        }

        #header .version {
            font-size: 16px;
            color: var(--text-color);
            opacity: 0.7;
            font-weight: 400;
        }

        #content {
            background: var(--bg-content);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: background 0.2s;
        }

        img { max-width: 100%; }

        pre {
            background: var(--code-bg);
            padding: 10px;
            overflow-x: auto;
            border-radius: 4px;
        }

        pre code.hljs {
            background: var(--code-bg) !important;
        }

        code {
            background: var(--code-bg);
            padding: 2px 4px;
            border-radius: 3px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        td, th {
            border: 1px solid var(--table-border);
            padding: 8px;
        }

        a {
            color: var(--link-color);
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }

        .footer {
            margin-top: 30px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
            text-align: center;
            color: var(--text-color);
            font-size: 14px;
        }

        .footer a {
            color: var(--link-color);
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }

        .footer i {
            margin-right: 6px;
        }
    </style>
</head>
<body>

    <div id="header">
        <h1>TUI Compose</h1>
        <span class="version" id="version">vX.X</span>
    </div>

    <div id="content"></div>

    <div class="footer">
        <a href="https://github.com/romanSPB15/tui-compose" target="_blank">
            <i class="fab fa-github"></i>Репозиторий на GitHub
        </a>
    </div>

    <script>
        function fixRelativeLinks(md) {
            return md.replace(/\]\(([^)]+)\)/g, function(match, p1) {
                if (p1.startsWith('http://') || p1.startsWith('https://')) {
                    return match;
                }
                if (!p1.startsWith('/') && !p1.startsWith('#')) {
                    return '](https://raw.githubusercontent.com/romanSPB15/tui-compose/main/' + p1 + ')';
                }
                return match;
            });
        }

        fetch('https://api.github.com/repos/romanSPB15/tui-compose/releases/latest')
            .then(res => res.json())
            .then(data => {
                document.getElementById('version').textContent = data.tag_name || 'v3.4';
            })
            .catch(() => {
                document.getElementById('version').textContent = 'v3.4';
            });

        fetch('https://raw.githubusercontent.com/romanSPB15/tui-compose/main/README.md')
            .then(res => res.text())
            .then(md => {
                const fixedMd = fixRelativeLinks(md);
                marked.setOptions({
                    highlight: function(code, lang) {
                        if (lang && hljs.getLanguage(lang)) {
                            return hljs.highlight(code, { language: lang }).value;

                        }
                        return hljs.highlightAuto(code).value;
                    }
                });

                document.getElementById('content').innerHTML = marked.parse(fixedMd);
                hljs.highlightAll();
            })
            .catch(() => {
                document.getElementById('content').innerHTML = '<p style="color:red;">Не удалось загрузить README.md</p>';
            });
    </script>

</body>
</html>
